<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password - Forge Of Traders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth/sign-in.css?v=7">
</head>
<body class="bg-black-light">
  <div class="auth__page auth__page--login">
    <div class="page__body">
      <img class="body__logo" src="/auth/logo.svg" alt="Website Logo" width="130" height="113">

      <h1>Forgot Password?</h1>
      <h2>Enter your email and we'll send you instructions to reset your password</h2>
      <p class="welcome-note" id="reset-note" hidden>Check your email. Your old password no longer works.</p>

      <form id="formAuthentication" action="/forgot-password" method="post" novalidate>
        <div class="input__default">
          <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" autofocus>
          <label for="email">Email</label>
          <div class="invalid-feedback"></div>
        </div>

        <button class="btn btn-primary" type="submit">Send Password Reset</button>
      </form>

      <p class="body__redirect-link no-underline">
        <a href="/sign-in">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
          Back to login
        </a>
      </p>
    </div>

    <img alt="" src="/auth/auth-bg.jpg" class="auth__page--background">
  </div>
  <script src="/auth/forgot-password.js?v=1"></script>
</body>
</html>
