<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - Forge Of Traders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth/sign-in.css?v=6">
</head>
<body class="bg-black-light">
  <div class="auth__page auth__page--register">
    <div class="page__body">
      <img class="body__logo" src="/auth/logo.svg" alt="Website Logo" width="130" height="113">

      <h1>Adventure starts here</h1>
      <h2>Make your app management easy and fun!</h2>

      <form id="formAuthentication" action="/sign-up" method="post" novalidate>
        <div class="register-account">
          <div class="input__default">
            <input type="text" id="first_name" name="first_name" placeholder="First name" autocomplete="given-name" autofocus>
            <label for="first_name">First name</label>
            <div class="invalid-feedback" data-for="first_name"></div>
          </div>

          <div class="input__default">
            <input type="text" id="last_name" name="last_name" placeholder="Last name" autocomplete="family-name">
            <label for="last_name">Last name</label>
            <div class="invalid-feedback" data-for="last_name"></div>
          </div>

          <div class="input__default">
            <input type="text" id="email" name="email" placeholder="Email" autocomplete="email">
            <label for="email">Email</label>
            <div class="invalid-feedback" data-for="email"></div>
          </div>
        </div>

        <div class="register-password">
          <div class="input__default form-password-toggle">
            <input type="password" id="password" name="password" placeholder="············" autocomplete="new-password">
            <label for="password">Password</label>
            <div class="invalid-feedback" data-for="password"></div>
            <button type="button" class="password-toggle" aria-label="Show password">
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M2,5.27L3.28,4L20,20.72L18.73,22L15.65,18.92C14.5,19.3 13.28,19.5 12,19.5C7,19.5 2.73,16.39 1,12C1.69,10.24 2.79,8.69 4.19,7.46L2,5.27M12,9A3,3 0 0,1 15,12C15,12.35 14.94,12.69 14.83,13L11,9.17C11.31,9.06 11.65,9 12,9M12,4.5C17,4.5 21.27,7.61 23,12C22.18,14.08 20.79,15.88 19,17.19L17.58,15.76C18.94,14.82 20.06,13.54 20.82,12C19.17,8.64 15.76,6.5 12,6.5C10.91,6.5 9.84,6.68 8.84,7L7.3,5.47C8.74,4.85 10.33,4.5 12,4.5M3.18,12C4.83,15.36 8.24,17.5 12,17.5C12.69,17.5 13.37,17.43 14,17.29L11.72,15C10.29,14.85 9.15,13.71 9,12.28L5.6,8.87C4.61,9.72 3.78,10.78 3.18,12Z"/>
              </svg>
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9M12,4.5C17,4.5 21.27,7.61 23,12C21.27,16.39 17,19.5 12,19.5C7,19.5 2.73,16.39 1,12C2.73,7.61 7,4.5 12,4.5M3.18,12C4.83,15.36 8.24,17.5 12,17.5C15.76,17.5 19.17,15.36 20.82,12C19.17,8.64 15.76,6.5 12,6.5C8.24,6.5 4.83,8.64 3.18,12Z"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="btn btn-primary" type="submit">Next</button>
      </form>

      <p class="body__redirect-link">
        Already have an account?
        <a href="/sign-in">Login here</a>
      </p>
    </div>

    <img alt="" src="/auth/auth-bg.jpg" class="auth__page--background">
  </div>
  <script src="/auth/sign-up.js?v=2"></script>
</body>
</html>
